<!-- ════════════════════════════════════════════════════════════════════════════
     corpsec-ops-platform — Wazuh Manager configuration
     Aggregates: Okta, CrowdStrike, Google Workspace, 1Password, Intune
     Plus: DLP, AI exfil detection, EDR, FIM, vuln detector
     ════════════════════════════════════════════════════════════════════════════ -->
<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.org</smtp_server>
    <email_from>wazuh@corpsec.local</email_from>
    <email_to>soc@corpsec.local</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ── Webhook integrations to n8n SOAR ───────────────────────────────────── -->
  <integration>
    <name>custom-n8n-alert</name>
    <hook_url>http://n8n:5678/webhook/wazuh-alert</hook_url>
    <level>7</level>
    <alert_format>json</alert_format>
  </integration>

  <integration>
    <name>custom-n8n-critical</name>
    <hook_url>http://n8n:5678/webhook/wazuh-critical</hook_url>
    <level>12</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- ── File Integrity Monitoring (FIM) ────────────────────────────────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>600</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Sensitive corporate data directories — DLP detection vectors -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/legal</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/client-data</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/finance</directories>

    <!-- System binaries and config -->
    <directories check_all="yes" realtime="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/usr/bin</directories>
    <directories check_all="yes" realtime="yes">/usr/sbin</directories>
    <directories check_all="yes" realtime="yes">/bin</directories>
    <directories check_all="yes" realtime="yes">/sbin</directories>

    <!-- Windows critical paths (when agent is on Windows endpoint) -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">C:\Program Files</directories>

    <!-- Standard ignores -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <nodiff>/etc/ssl/private.key</nodiff>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>

    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
    <sync_enabled>yes</sync_enabled>
    <sync_interval>5m</sync_interval>
    <sync_max_interval>1h</sync_max_interval>
  </syscheck>

  <!-- ── Rootcheck — Detect rootkits, anomalies, system audits ──────────────── -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- ── Vulnerability Detector ─────────────────────────────────────────────── -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <ignore_time>6h</ignore_time>
    <run_on_start>yes</run_on_start>

    <provider name="canonical">
      <enabled>yes</enabled>
      <os>focal</os>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="debian">
      <enabled>yes</enabled>
      <os>bullseye</os>
      <os>bookworm</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="redhat">
      <enabled>yes</enabled>
      <os>8</os>
      <os>9</os>
      <update_from_year>2010</update_from_year>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="msu">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="nvd">
      <enabled>yes</enabled>
      <update_from_year>2010</update_from_year>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- ── Syscollector — Asset inventory ────────────────────────────────────── -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ── SCA — Security Configuration Assessment (CIS benchmarks) ───────────── -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- ── osquery integration ────────────────────────────────────────────────── -->
  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <!-- ── Active Response — Auto-remediation ─────────────────────────────────── -->
  <command>
    <name>disable-account</name>
    <executable>disable-user.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <command>
    <name>block-exfil</name>
    <executable>block-exfil.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Auto-block IPs after 5+ failed authentications -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5763,5712,100100</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Disable Okta user on DLP HIGH or AI exfil CRITICAL -->
  <active-response>
    <command>disable-account</command>
    <location>server</location>
    <rules_id>100102,100103,100201,100202</rules_id>
    <timeout>0</timeout>
  </active-response>

  <!-- Block exfil destination on AI exfil detection -->
  <active-response>
    <command>block-exfil</command>
    <location>server</location>
    <rules_id>100201,100202,100203</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- ── Log collection — Real production tool feeds ────────────────────────── -->

  <!-- Okta system logs (streamed by integrations/okta/log_streamer.py) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/okta-events.jsonl</location>
  </localfile>

  <!-- CrowdStrike Falcon detections (streamed by integrations/crowdstrike/detection_streamer.py) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/crowdstrike-detections.jsonl</location>
  </localfile>

  <!-- Google Workspace audit logs -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/gws-audit.jsonl</location>
  </localfile>

  <!-- 1Password audit events -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/onepassword-audit.jsonl</location>
  </localfile>

  <!-- Intune device events via Microsoft Graph -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/intune-events.jsonl</location>
  </localfile>

  <!-- DLP engine alerts -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/dlp-alerts.jsonl</location>
  </localfile>

  <!-- AI exfiltration detection alerts -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/corpsec/ai-detection.jsonl</location>
  </localfile>

  <!-- Standard system logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- ── Remote agent connections ──────────────────────────────────────────── -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <!-- ── Auth daemon (agent registration) ───────────────────────────────────── -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <!-- ── Cluster (single-node here, but production-ready) ───────────────────── -->
  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>${WAZUH_CLUSTER_KEY}</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh-manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>

  <!-- Default rules + decoders -->
  <rule_dir pattern=".xml">etc/rules</rule_dir>
  <decoder_dir pattern=".xml">etc/decoders</decoder_dir>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>

    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

</ossec_config>
