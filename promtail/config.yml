server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - regex:
          expression: ^(?P<container_id>(?:[0-9a-f]{12})).*$
          source: filename
      - labels:
          stream:
          container_id:
      - output:
          source: output

  - job_name: corpsec-jsonl
    static_configs:
      - targets: [localhost]
        labels:
          job: corpsec-events
          __path__: /var/log/corpsec/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            source: source
            severity: severity
            user: user
      - labels:
          source:
          severity:
