# ══════════════════════════════════════════════════════════════════════════════
# corpsec-ops-platform — TheHive 5 application configuration
# ══════════════════════════════════════════════════════════════════════════════

# Storage backend - Cassandra
db.janusgraph {
  storage {
    backend = cql
    hostname = ["thehive-db"]
    cql.cluster-name = thp
    cql.keyspace = thehive
  }
  index.search {
    backend = elasticsearch
    hostname = ["thehive-index"]
    index-name = thehive
  }
}

# File storage
storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/files
}

# Cortex integration
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule
cortex {
  servers = [
    {
      name = local
      url = "http://cortex:9001"
      auth { type = "bearer", key = ${CORTEX_API_KEY} }
      includedTheHiveOrganisations = ["*"]
      excludedTheHiveOrganisations = []
    }
  ]
}

# Application secret
play.http.secret.key = ${?THEHIVE_SECRET}

# CORS for web UI
play.filters.enabled += play.filters.cors.CORSFilter
play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = null
  allowedHttpHeaders = null
}

# Default user provisioning (admin organisation)
default.organisation = "corpsec"
auth {
  providers = [
    {name = session}
    {name = basic, realm = thehive}
    {name = local}
    {name = key}
  ]
  defaultUserDomain = "corpsec.local"
}

# SLA defaults (Wazuh-aligned severities)
sla {
  P1.responseTime = 1h
  P2.responseTime = 4h
  P3.responseTime = 24h
  P4.responseTime = 72h
}
