# ══════════════════════════════════════════════════════════════════════════════
# corpsec-ops-platform — Cortex 3 application configuration
# ══════════════════════════════════════════════════════════════════════════════

# Application secret (regenerate via cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64)
play.http.secret.key = ${?CORTEX_SECRET}

# Storage — Elasticsearch shared with TheHive
search {
  index = cortex
  uri = "http://thehive-index:9200"
}

# Analyzer paths
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json",
    "/opt/cortex/custom-analyzers"
  ]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

# Responder paths
responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

# Job retention
job.runner = [docker, process]

# Logging
include "logback.conf"
